name: CI

on: [push, pull_request]

jobs:
  style:
    runs-on: ubuntu-latest
    name: Style checks

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.2

      - name: Install dependencies
        run: |
          npm i prettier

      - name: Prettier
        run: ./node_modules/prettier/bin-prettier.js --check ./src/* ./src/**/* ./src/**/**/* ./sass/*.scss

  build:
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} (${{ matrix.os }}, Node ${{ matrix.node }})

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
            platform: chrome
          - os: ubuntu-latest
            node: 20
            platform: firefox
          - os: windows-latest
            node: 24
            platform: chrome

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Validate build script
        run: |
          node --check scripts/build.js
          node node_modules/prettier/bin-prettier.js --check scripts/build.js

      - name: Build
        run: npm run ${{ matrix.platform }}
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [build]

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.2

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      - name: Test code
        uses: mymindstorm/puppeteer-headful@8f745c770f7f4c0f9f332d7c43a775f90e53779a
        with:
          args: npm test
