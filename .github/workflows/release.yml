name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Chrome (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          node -e 'const expected = process.env.GITHUB_REF_NAME.slice(1); const actual = require("./manifests/manifest-chrome.json").version; if (actual !== expected) { throw new Error(`Tag ${expected} does not match manifest ${actual}`); }'

      - name: Build production extensions
        run: npm run prod

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: chrome-${{ matrix.platform }}
          path: release/chrome
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download macOS Chrome build
        uses: actions/download-artifact@v4
        with:
          name: chrome-macos
          path: artifacts/chrome-macos

      - name: Download Windows Chrome build
        uses: actions/download-artifact@v4
        with:
          name: chrome-windows
          path: artifacts/chrome-windows

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release-assets
          (cd artifacts/chrome-macos && zip -qr "../../release-assets/authenticator-chrome-macos-${GITHUB_REF_NAME}.zip" .)
          (cd artifacts/chrome-windows && zip -qr "../../release-assets/authenticator-chrome-windows-${GITHUB_REF_NAME}.zip" .)
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Authenticator $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
